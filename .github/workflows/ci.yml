name: CI

on:
  push:
    branches: [main, 'setup/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev,storage]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Validate dataset registry
        run: python scripts/validate_dataset_registry.py
      - name: Test
        run: pytest
